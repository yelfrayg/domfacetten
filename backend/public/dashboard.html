                </nav>
                <div class="header-burger">
                    <button id="side-menu">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            height="24px"
                            viewBox="0 -960 960 960"
                            width="24px"
                            fill="#000000"

                </div>
                <aside class="mobile-menu">
                    <ul class="mobile-menu-list">
                        <li><a href="/">Home</a></li>
                        <li><a href="/productPage">Produkte</a></li>
                        <li><a href="/places">Orte</a></li>

                    </ul>
                </aside>
            </div>
        </header>
        <main>
            <h1>Willkommen in deinem Dashboard!</h1>
            <div class="user-container">
                <div class="personal-info">
                    <form id="updateUser">
                        <h2>Meine Angaben</h2>
                        <input
                            type="text"
                            name="firstname"
                            id="first-name"
                            value="Anna"
                            placeholder="Vorname"
                        />
                        <input
                            type="text"
                            id="last-name"
                            value="Maier"
                            placeholder="Nachname"
                        />
                        <input
                            type="email"
                            id="email"
                            value="anna-maier@test.com"
                            placeholder="E-Mail"
                        />
                        <input
                            type="text"
                            id="straße-nr"
                            value="Antonstraße 2"
                            placeholder="Straße + Hausnummer"
                        />
                        <input
                            type="text"
                            id="stadt-plz"
                            value="50679 Köln"
                            placeholder="PLZ + Stadt"
                        />
                        <div class="password">
                            <input
                                type="password"
                                id="new-password"
                                value="Passwort123"
                                placeholder="Neues Passwort"
                            />
                            <button type="button" id="show-password">
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    height="24px"
                                    viewBox="0 -960 960 960"
                                    width="24px"
                                    fill="#000000"
                                >
                                    <path
                                        d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm296.5-143.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"
                                    />
                                </svg>
                            </button>
                        </div>
                        <button type="submit" id="updateButton">
                            Daten aktualisieren
                        </button>
                    </form>
                </div>
                <div class="account-info">
                    <div class = "order-container">
                        <h2>Meine Bestellungen</h2>
                        <ul class="user-orders">
                            <!--? Hier werden die Bestellungen angezeigt -->
                        </ul>
                    </div>
                    <div class="button-actions">
                        <button id="deleteAccount">Account löschen</button>
                        <button id="logout">Abmelden</button>
                        <button id="returnLabel">Rücksendeformular herunterladen</button>
                    </div>
                </div>
            </div>
        </main>
        <footer>

                <img src="/images/Firmenlogo.svg" alt="Domfacetten" />

                    <li><a href="/">Home</a></li>

                <p>&copy; 2026 Domfacetten</p>
            </div>

</html>
